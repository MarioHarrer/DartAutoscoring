<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Dart Auto-Score Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #1e1e1e; color: white; margin: 0; padding: 20px; }
        .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .panel { background-color: #2d2d2d; padding: 15px; border-radius: 8px; }
        img { width: 100%; border-radius: 4px; }
        .controls { margin-bottom: 20px; }
        button { padding: 10px 20px; font-size: 16px; margin-right: 10px; cursor: pointer; border: none; border-radius: 4px; }

        .camera-controls { margin-top: 15px; margin-bottom: 20px; background-color: #2d2d2d; padding: 15px; border-radius: 8px; }
        .btn-active { background-color: #28a745; color: white; cursor: pointer; opacity: 1; }
        .btn-inactive { background-color: #6c757d; color: #ccc; cursor: not-allowed; opacity: 0.5; }
    </style>
</head>
<body>
<h1>Dart Tracker Dashboard</h1>

<div class="controls">
    <button onclick="fetch('/api/action/background')" style="background-color: #007bff; color: white;">Hintergrund speichern (b)</button>
    <button onclick="fetch('/api/action/throw')" style="background-color: #ffc107; color: black;">Wurf auswerten (t)</button>
</div>

<!-- Kamera Ein-/Ausschalt-Buttons (Immer vorhanden, Steuerung via JavaScript) -->
<div class="camera-controls">
    <h3>Kameras Ein-/Ausschalten (Ignorieren)</h3>
    <button onclick="toggleCamera(0)" id="btn-cam-0" class="btn-active">Kamera 1</button>
    <button onclick="toggleCamera(1)" id="btn-cam-1" class="btn-active">Kamera 2</button>
    <button onclick="toggleCamera(2)" id="btn-cam-2" class="btn-active">Kamera 3</button>
</div>

<div class="grid-container">
    <div class="panel"><h3>Live View Kameras</h3><img src="/stream/live" alt="Live View"></div>
    <div class="panel"><h3>Top Down (Resultat)</h3><img src="/stream/result" alt="Result"></div>
    <div class="panel"><h3>SAM2 Segmentierung</h3><img src="/stream/debug" alt="Debug"></div>
    <div class="panel"><h3>Homografie Entzerrung</h3><img src="/stream/homography" alt="Homography"></div>
</div>

<script>
    // Funktion zum Umschalten der Kameras direkt per Klick im Dashboard
    function toggleCamera(cid) {
        fetch(`/api/camera/toggle/${cid}`, { method: 'POST' })
            .then(res => res.json())
            .then(data => {
                console.log("Kamera Toggle Response:", data);
            })
            .catch(err => console.error("Fehler beim Umschalten der Kamera:", err));
    }
</script>

<script src="{{ url_for('static', filename='dashboard.js') }}"></script>
</body>
</html>
